    <main>
        <section class="contact">
  <div class="contact__container">

    <!-- LEFT -->
    <div class="contact__left">

      <!-- JUST CONTACT TEXT (IMAGE) -->
      <img
        class="contact-title-img"
        src="./assets/images/cards/just.png"
        alt="Just Contact"
      />

      <!-- PHONE IMAGE -->
      <img
        class="phone-img"
        src="./assets/images/home/telephone.png"
        alt="Phone Mockup"
      />

   

    </div>

    <!-- RIGHT -->
    <div class="contact__right">
      <h2 class="form-title">
        Customer <span>Support</span>
      </h2>

      <form class="contact-form">
        <input type="text" placeholder="FULL NAME" />
        <input type="email" placeholder="ENTER YOUR EMAIL" />
        <textarea placeholder="ENTER THE PROBLEM OR QUERY"></textarea>
        <button type="submit">Send Now</button>
      </form>
    </div>

  </div>
</section>

    </main>
     <footer class="footer">
      <!-- Tepadagi content -->
      <div class="footer__content-top container">
        <!-- Chap ustun tepada: faqat logo -->
        <div class="footer__left-top">
          <img
            src="./assets/images/footer/eatly-logo.png"
            alt="Eatly logo"
            class="footer__logo"
          />
        </div>

        <!-- Ong ustun tepada: nav linklar -->
        <div class="footer__right-top">
          <nav class="footer__menu">
            <a href="#">Blog</a>
            <a href="#">Pricing</a>
            <a href="#">About Us</a>
            <a href="#">Contact</a>
          </nav>
        </div>
      </div>

      <!-- O‘rtadagi gorizontal chiziq -->
      <div class="footer__divider container"></div>

      <!-- Pastdagi content -->
      <div class="footer__content-bottom container">
        <!-- Chap ustun pastda: copyright -->
        <div class="footer__left-bottom">
          <p class="footer__copyright">© 2025 EATLY All Rights Reserved.</p>
        </div>

        <!-- Ong ustun pastda: social ikonlar -->
        <div class="footer__right-bottom">
          <div class="footer__socials">
            <a href="https://www.instagram.com/"
              ><img
                src="./assets/images/footer/instagram-logo.png"
                alt="Instagram"
            /></a>
            <a href="https://www.linkedin.com/"
              ><img
                src="./assets/images/footer/Linkedin-logo.png"
                alt="LinkedIn"
            /></a>
            <a href="https://www.facebook.com/"
              ><img
                src="./assets/images/footer/facebook-logo.png"
                alt="Facebook"
            /></a>
            <a href="https://x.com/"
              ><img src="./assets/images/footer/twitter-logo.png" alt="Twitter"
            /></a>
          </div>
        </div>
      </div>
    </footer>
